<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Material Inventory Dashboard</title>
    <script src="Inv.js" defer></script> <!-- Refer to your JavaScript file -->
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .header, .footer {
            background-color: #f4f4f4;
            padding: 10px;
            text-align: center;
        }
        .container {
            display: flex;
        }
        .sidebar {
            width: 200px;
            background: #f0f0f0;
            padding: 15px;
        }
        .content {
            flex: 1;
            padding: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="date"], input[type="number"], button {
            width: 100%;
            padding: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Common Header -->
    <header>
        <h1>Raw Material Inventory Management</h1>
    </header>

    <div class="container">
        <!-- Left Navigation Menu -->
        <nav class="sidebar">
            <ul>
                <li><button id="menuItemManagement" onclick="navigateTo('itemManagement')">Item Management</button></li>
                <li><button id="menuItemReceived" onclick="navigateTo('itemReceived')">Item Received</button></li>
                <li><button id="menuItemIssued" onclick="navigateTo('itemIssued')">Item Issued</button></li>
                <li><button id="menuItemReport" onclick="navigateTo('itemReport')">Item Report</button></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <section id="itemManagement" class="content-section" style="display: none;">
                <h2>Item Management</h2>
                <form>
                    <label for="itemId">Item ID:</label>
                    <input type="text" id="itemId">

                    <label for="itemName">Item Name:</label>
                    <input type="text" id="itemName">

                    <label for="openingStock">Opening Stock:</label>
                    <input type="number" id="openingStock">

                    <label for="uom">Unit of Measurement (UoM):</label>
                    <input type="text" id="uom">

                    <button type="button" id="saveItemBtn">Save</button>
                </form>
            </section>

            <section id="itemReceived" class="content-section" style="display: none;">
                <h2>Item Received</h2>
                <form>
                    <label for="receiptNo">Receipt No:</label>
                    <input type="text" id="receiptNo">

                    <label for="receiptDate">Receipt Date:</label>
                    <input type="date" id="receiptDate">

                    <label for="itemReceivedId">Item ID:</label>
                    <input type="text" id="itemReceivedId">

                    <label for="qtyReceived">Quantity Received:</label>
                    <input type="number" id="qtyReceived">

                    <button type="button" id="loadReceiptBtn">Load Receipt</button>
                    <button type="button" id="saveReceivedBtn">Save</button>
                </form>
            </section>

            <section id="itemIssued" class="content-section" style="display: none;">
                <h2>Item Issued</h2>
                <form>
                    <label for="issueNo">Issue No:</label>
                    <input type="text" id="issueNo">

                    <label for="issueDate">Issue Date:</label>
                    <input type="date" id="issueDate">

                    <label for="itemIssuedId">Item ID:</label>
                    <input type="text" id="itemIssuedId">

                    <label for="qtyIssued">Quantity Issued:</label>
                    <input type="number" id="qtyIssued">

                    <button type="button" id="saveIssuedBtn">Save</button>
                </form>
            </section>

            <section id="itemReport" class="content-section" style="display: none;">
                <h2>Item Report</h2>
                <form>
                    <label for="itemRangeStart">Item ID Range Start:</label>
                    <input type="text" id="itemRangeStart">

                    <label for="itemRangeEnd">Item ID Range End:</label>
                    <input type="text" id="itemRangeEnd">

                    <button type="button" id="generateReportBtn">Generate Report</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Common Footer -->
    <footer>
        <p>2025 Raw Material Inventory Management.</p>
    </footer>
</body>
</html>
